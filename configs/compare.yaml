
# Comparación de los métodos de la Parte 1 (configuración COMPLETA).
# Mismo presupuesto, semillas y umbrales que configs/gd.yaml (ver docs/decisiones.md).
# Formato común de los métodos: src/result.py - registro de métodos: src/methods.py

funciones: [rosenbrock, rastrigin]
dimensiones: [2, 3]
n_runs: 30

presupuesto: # evaluaciones equivalentes (f + grad_cost * grad)
  2: 20000
  3: 40000

grad_cost: 1.0
umbrales_exito: [0.0001, 0.01] # éxito si f - f_opt <= umbral
puntos_curva: 200

metodos:
  gd:
    rosenbrock: {lr: 0.0002}
    rastrigin: {lr: 0.003}

  ea:
    rosenbrock:
      population_size: 30
      crossover_rate: 0.9
      mutation_scale: 0.1
      tournament_size: 3
    rastrigin:
      population_size: 30
      crossover_rate: 0.9
      mutation_scale: 0.1
      tournament_size: 3

  pso:
    rosenbrock: {n_particles: 30, c1: 0.8, c2: 0.4, w: 0.1}
    rastrigin: {n_particles: 30, c1: 0.8, c2: 0.4, w: 0.1}

  de:
    rosenbrock: {population_size: 30, F: 0.5, CR: 0.9}
    rastrigin: {population_size: 30, F: 0.5, CR: 0.9}

salidas:
  resultados: results/compare
  figuras: figures/compare
