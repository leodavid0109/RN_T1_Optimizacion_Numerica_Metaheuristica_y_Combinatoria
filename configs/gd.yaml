# Experimento de la Parte 1: descenso por gradiente (configuración COMPLETA).
# PROPUESTAS del integrante 1: el equipo debe confirmarlas y justificarlas en el reporte.
funciones: [rosenbrock, rastrigin]
dimensiones: [2, 3]
n_runs: 30                 # semillas 0..29 (src/seeds.py)
presupuesto:               # evaluaciones equivalentes (f + grad_cost * grad)
  2: 20000
  3: 40000
grad_cost: 1.0             # una evaluación de gradiente analítico cuenta como grad_cost evaluaciones de f
tasas_aprendizaje:         # barrido del paso fijo
  rosenbrock: [0.00001, 0.00005, 0.0001, 0.0002]
  rastrigin: [0.0001, 0.001, 0.003]    # el paso debe ser < 2/397 ~ 0.005 (curvatura en el óptimo)
umbrales_exito: [0.0001, 0.01]         # éxito si f - f_opt < umbral
puntos_curva: 200
gif_semilla: 0
